<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc"><title id="title">Air Guardian implementation</title><desc id="desc">Provider adapters to Python engine, school plan, role views and review receipts. Local memory preview; separate AWS template uses Lambda, DynamoDB, Cognito and SQS.</desc><g fill="white" stroke="#dadce0"><rect x="10" y="25" width="175" height="125" rx="16"/><rect x="210" y="25" width="175" height="125" rx="16"/><rect x="410" y="25" width="175" height="125" rx="16"/><rect x="610" y="25" width="175" height="125" rx="16"/><rect x="810" y="25" width="175" height="125" rx="16"/></g><g font-family="system-ui" fill="#202124" text-anchor="middle" font-size="18"><text x="97" y="65">Air inputs</text><text x="297" y="65">Policy engine</text><text x="497" y="65">School plan</text><text x="697" y="65">Role views</text><text x="897" y="65">Reviews</text><g font-size="13"><text x="97" y="95">Provider adapters</text><text x="97" y="117">Fixtures locally</text><text x="297" y="95">Python · Powertools</text><text x="297" y="117">Lambda template</text><text x="497" y="95">Adult publication</text><text x="497" y="117">SQS delivery template</text><text x="697" y="95">Vanilla HTML / JS</text><text x="697" y="117">Cognito template</text><text x="897" y="95">MemoryStore locally</text><text x="897" y="117">DynamoDB template</text></g></g><path d="M185 87h25m175 0h25m175 0h25m175 0h25" stroke="#0766ab" stroke-width="3"/><text x="500" y="177" font-family="system-ui" font-size="14" text-anchor="middle" fill="#5f6368">Cloud resources are implemented in templates. No AWS deployment is claimed.</text></svg>
